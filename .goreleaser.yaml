# GoReleaser config: a universal macOS binary (Homebrew cask in
# Paksonite/homebrew-tap), Linux binaries for amd64/arm64 as archives and
# .deb/.rpm packages, all attached to a GitHub Release.
# Local dry run (nothing is published): make snapshot
version: 2

project_name: gitnest

git:
  # "dev" is the rolling tag of the gitnest-dev preview builds
  # (.github/workflows/dev.yml), not a version: never use it for version
  # numbers or as the previous release in changelogs.
  ignore_tags: [dev, "pre-*"]

before:
  hooks:
    - go mod download
    - sh -c "mkdir -p completions && go run ./cmd/gitnest completion zsh > completions/_gitnest && go run ./cmd/gitnest completion bash > completions/gitnest.bash"

builds:
  - id: darwin
    main: ./cmd/gitnest
    binary: gitnest
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: linux
    main: ./cmd/gitnest
    binary: gitnest
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"

universal_binaries:
  - id: darwin-universal
    ids: [darwin]
    replace: true

archives:
  - id: darwin
    ids: [darwin-universal]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_darwin_universal"
    files:
      - LICENSE
      - README.md
      - completions/*
  - id: linux
    ids: [linux]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_linux_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - completions/*

nfpms:
  - id: packages
    ids: [linux]
    package_name: gitnest
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    vendor: Paksonite
    homepage: https://github.com/Paksonite/gitnest
    maintainer: gitnest maintainers <noreply@github.com>
    description: Terminal UI for managing many git repositories
    license: MIT
    formats: [deb, rpm]
    dependencies: [git]
    contents:
      - src: completions/gitnest.bash
        dst: /usr/share/bash-completion/completions/gitnest
      - src: completions/_gitnest
        dst: /usr/share/zsh/vendor-completions/_gitnest
      - src: LICENSE
        dst: /usr/share/doc/gitnest/LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: Paksonite
    name: gitnest
  # v1.1.0-rc.1 and the like become GitHub pre-releases: never "latest", so
  # gitnest update, install.sh and the update notice don't offer them.
  prerelease: auto

homebrew_casks:
  - name: gitnest
    ids: [darwin]
    binaries: [gitnest]
    completions:
      zsh: completions/_gitnest
    homepage: https://github.com/Paksonite/gitnest
    description: Terminal UI for managing many git repositories
    directory: Casks
    # Pre-releases don't touch the tap: brew users stay on the last release.
    skip_upload: auto
    commit_msg_template: "gitnest {{ .Tag }}"
    # No custom_block with `depends_on macos: ">= :ventura"`: GoReleaser
    # always writes `depends_on :macos` for a macOS-only cask, and Homebrew
    # 7 refuses the two together ("Calling combining depends_on :macos with
    # a versioned macOS dependency is disabled"), which broke brew upgrade.
    # macOS 13+ is in README.md and docs/INSTALL.md.
    commit_author:
      name: gitnest-release-bot
      email: noreply@github.com
    repository:
      owner: Paksonite
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # The binary is not notarized: drop the quarantine flag so Gatekeeper
    # doesn't report it as damaged. install_steps (GoReleaser 2.19+) writes
    # postflight_steps: Homebrew 7 deprecates a Ruby postflight block. A
    # failing xattr must not fail the install.
    hooks:
      post:
        install_steps: |
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/gitnest"], must_succeed: false
