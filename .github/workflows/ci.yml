name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything on Ubuntu: formatting, vet, staticcheck, the tests with the
  # race detector, the scripts, and the smoke test (the terminal UI driven
  # through tmux, the one-line installer).
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go test -race ./...
      - name: shell scripts
        run: |
          shellcheck install.sh docs/demo-setup.sh scripts/linux-smoke.sh
          go run ./cmd/gitnest completion bash | bash -n
          go run ./cmd/gitnest shell bash | bash -n
      - name: smoke test
        run: |
          sudo apt-get install -y -q tmux >/dev/null
          CGO_ENABLED=0 go build -o /tmp/smoke/gitnest ./cmd/gitnest
          sh scripts/linux-smoke.sh /tmp/smoke/gitnest

  # The tests on macOS (no race detector: Linux runs it).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - run: go test ./...

  # The tests and the smoke test on the oldest systems supported, with
  # their own git: Debian 12 (git 2.39) and Ubuntu 22.04 (git 2.34). The
  # runner's Go toolchain and module cache are lent to the containers.
  distros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:22.04"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - run: go mod download && CGO_ENABLED=0 go build -o /tmp/smoke/gitnest ./cmd/gitnest
      - name: tests and smoke test in ${{ matrix.image }}
        run: |
          docker run --rm -e DEBIAN_FRONTEND=noninteractive -e CGO_ENABLED=0 -e GOFLAGS=-mod=mod \
            -v "$PWD:/src" -v "$(go env GOROOT):/goroot:ro" -v "$(go env GOMODCACHE):/gomod" \
            -v /tmp/smoke:/smoke ${{ matrix.image }} sh -c "
              apt-get update -q >/dev/null &&
              apt-get install -y -q --no-install-recommends git tmux curl ca-certificates >/dev/null &&
              git config --global --add safe.directory /src && git --version &&
              cd /src && GOMODCACHE=/gomod GOCACHE=/tmp/gocache /goroot/bin/go test ./... &&
              sh scripts/linux-smoke.sh /smoke/gitnest"

  # Build the release packages and install the .deb on a clean Debian.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          HOMEBREW_TAP_TOKEN: unused
      - name: install the .deb on Debian 12
        run: |
          deb=$(ls dist/*_amd64.deb)
          docker run --rm -v "$PWD/dist:/dist" debian:12 sh -c "
            apt-get update -q && apt-get install -y -q /dist/$(basename "$deb") &&
            gitnest version &&
            test -f /usr/share/bash-completion/completions/gitnest &&
            mkdir -p /root/repos/demo && git -C /root/repos/demo init -q &&
            gitnest roots add /root/repos && gitnest scan && gitnest doctor"
